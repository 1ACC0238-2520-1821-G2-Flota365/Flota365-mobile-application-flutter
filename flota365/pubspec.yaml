name: flota365
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.2

  # ⭐ Dependencias principales
  flutter_dotenv: ^6.0.0
  google_maps_flutter: ^2.6.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  dio: ^5.7.0
  flutter_polyline_points: ^3.1.0
  
    

  # ⭐ HIVE (Storage local)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ⭐ PAQUETES PARA ESTADO Y ALMACENAMIENTO
  flutter_secure_storage: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  shared_preferences: ^2.5.3
  http: ^1.6.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - lib/features/auth/assets/

flutter_icons:
  android: true
  ios: true
  image_path: "lib/features/auth/assets/logo.png"
  
